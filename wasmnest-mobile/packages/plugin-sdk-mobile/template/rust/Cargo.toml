[package]
name = "{{CRATE}}"
version = "0.0.1"
license = "MIT"
edition = "2021"

[dependencies]
wasmnest-plugin-api-mobile = {{SDK_RUST}}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[features]
default = []
# WASM 插件必开：启用 WasmPlugin trait / wasm_entry! 宏 / WasmHost 绑定
wasm = ["wasmnest-plugin-api-mobile/wasm"]

[lib]
crate-type = ["cdylib", "rlib"]
