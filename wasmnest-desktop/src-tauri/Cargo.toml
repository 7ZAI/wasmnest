[package]
# ==================== L2：通用宿主 runtime crate（可分发形态） ====================
# 本 crate 从「宿主 bin crate」升为**唯一**通用 runtime crate（票据
# .scratch/2026-10-21-host-runtime-distribution/spec.md D4 / CONTRACT §5）：
# - 包名带 `-runtime`，供外部工程作为编译期依赖 / `cargo install` 消费；
# - 二进制名经显式 `[[bin]]` 保持 `wasmnest-desktop`（安装入口、host:pack 产物名不变）；
# - 壳前端随包分发（`shell-dist/`，签入），`tauri.conf.json` 的 frontendDist 指向它；
# - 能力仓依赖全部固定为 git tag，桌面 SDK 固定为 crates.io 精确版本，
#   本地开发经平台仓根 `.cargo/config.toml` 的 [patch] 指回兄弟目录（不进发布包）。
# 安装通道 = crates.io（平台仓刻意无根 workspace，`cargo install --git` 不能定位本 crate，
# 见票据「关键裁决」）。批 2（issue #36）起宿主不再依赖桌面 SDK，发布无 SDK 前置。
name = "wasmnest-desktop-runtime"
version = "0.0.1"
license = "MIT"
description = "WasmNest Desktop runtime - Tauri shell + plugin host for wasm apps (generic, full WIT)"
authors = ["binblink"]
edition = "2021"
repository = "https://github.com/7ZAI/wasmnest"

# 随包文件白名单：壳上下文（tauri.conf / capabilities / icons / 内置配置）与壳前端
# （shell-dist/**）必须进包，否则 cargo install 后启动白屏或权限面缺失。
# 构建期资源目录 `resources/plugins/` 是 gitignore 的运行期产物，不在发布包内
# （宿主以 WASMNEST_PLUGINS_DIR 指定外部插件目录）。
include = [
  "src/**",
  "build.rs",
  "Cargo.toml",
  "tauri.conf.json",
  "capabilities/**",
  "icons/**",
  "resources/config.properties",
  "resources/plugins/.gitkeep",
  "resources/deb/**",
  "nsis/**",
  "shell-dist/**",
  "README*",
]

[lib]
name = "wasmnest_desktop_lib"
crate-type = ["cdylib", "rlib"]

# 显式 bin：包名改名后仍产出 `wasmnest-desktop`（host:pack / E2E / 安装入口按此名寻址）
[[bin]]
name = "wasmnest-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "test"] }
# tauri-plugin-shell 已移除（前端零资源访问红线）：它给前端提供 open/spawn/execute 的
# 直接调用面，而 shell:allow-open 正是靠一条 capability 就放开的。宿主侧打开外部链接改用
# tauri-plugin-opener（与移动端同一口径），见 commands.rs::open_external_url。
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
# WDIO E2E 测试插件：注册仍由 lib.rs 的 cfg(debug_assertions) 门控（release 只编译不注册）。
# 不置于 [target.'cfg(debug_assertions)'.dependencies]：cargo 不支持用 debug_assertions
# 选择依赖（会产生 manifest warning 且不按预期工作），故放普通依赖 + 代码层门控。
#
# 必须是**跨平台**普通依赖：capabilities/default.json 声明了 `wdio:default` 权限，
# 插件没编进去就解析不到这条权限（macOS / Windows 实测 `Permission wdio:default not
# found` → 构建直接失败）。此前它误写在 [target.'cfg(target_os = "linux")'.dependencies]
# 段尾，只有 Linux 编到，首次三平台发布才暴露。
tauri-plugin-wdio = "1"
tauri-plugin-process = "2"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "test-util"] }

# Database
# hooks feature：SQLite progress handler（宿主侧硬中断慢查询，DB 执行护栏票据 05）
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }

# Security
jsonwebtoken = "9"
# 生物凭证验签（EC P-256 / ECDSA-SHA256，与移动端 Keystore 生成的密钥配套）
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

# Encoding
encoding_rs = "0.8"
base64 = "0.22"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }


# Logging
tracing = { version = "0.1", features = ["log", "attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-error = "0.2"
tracing-log = "0.2"
# ANSI 样式（控制台日志格式化器使用；与 tracing-subscriber 传递依赖同版本）
nu-ansi-term = "0.50"

# File watching
notify = "6"

# Regex for parsing
regex = "1"

# WASM runtime for plugin system
# 48（LTS，2026-08-24）：47 非 LTS 支持期将尽（48 发布后 ~2026-10）；48 为 12 倍数 LTS（支持 24 个月）。
# 升级范围：48 起双端同步（此前桌面单端先行、移动端滞后一版为临时分叉，收口评估见 .scratch/2026-09-26-mobile-wasmtime-48-wasip3/spec.md）
wasmtime = "48"

# HTTP client (WASM plugin HTTP proxy)
reqwest = { version = "0.12", features = ["stream"] }

# mDNS service discovery
mdns-sd = "0.20"

# Network utilities
local-ip-address = "0.6"


# Plugin API 依赖已摘除（批 2，issue #36）：权限词汇 / FORM_COMPONENT / 事件 topic
# 词汇真源已上提 wasm-core（permission / manager::runtime / host_api::topics），
# 宿主生产源码与测试全部经 wasm_core 垫片消费 core 真源。core 的 desktop-assembly
# feature 对桌面 SDK 的传递依赖（原生插件体系 / intercall 词汇）由票 10（E2a-A）
# 整体迁桌面宿主时清偿——本 crate 不再直接依赖 SDK，发布不再前置 SDK 上 crates.io。
# ==================== 能力仓依赖（git tag 固定，可发布） ====================
# L2：11 条 wasmnest-lib 依赖从 path 改为 git tag。理由：`cargo package` / 外部工程
# 消费时不存在 `../../../wasmnest-lib` 兄弟目录，path 依赖会让 crate 不可发布；
# git tag 提供同样的编译期固定版本（tag 不可移动，发布线 = lib-v0.0.1）。
# 本地同场开发由平台仓根 `.cargo/config.toml` 的
# `[patch."https://github.com/7ZAI/wasmnest-lib"]` 指回兄弟目录（patch 不进发布包）。
# `version` 与 tag 内各 crate 的 manifest 对齐（不匹配时 cargo fail-visible）。
# 对等网络共享基础设施（节点身份 + 自签证书，issue peer-network/01）
# 2026-10-22 peer-net-dissolve：底座拆分并入 wasmnest-server-peer-net（base/），本依赖删除
# 链路报文加密协议核心（issue 09 共享 crate，与移动端 event WS 共同消费）
wasmnest-link-crypto = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1" }
# server-lib-split：桌面 server 基础层（错误/常量/错误边界/系统信息/网络配置/
# 连接身份/端口 traits）与加密引擎（算法实现 + 注册表）
wasmnest-server-base = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1" }
# 插件宿主机制内核（能力仓 `../wasmnest-lib`，双端共享锚点，wasm-core-lib-split 票 03）：
# 插件实例状态 `WasmPluginState` + 能力模块契约 + 自动注册表 + Store 上限与指标值对象。
# 它必须独立于宿主 bin crate —— 否则能力 crate 无法命名 `WasmPluginState`
# （`add_to_linker::<S,D>` 是单态）⇒ 与宿主构成 Cargo 环。本期为**零行为变更的搬迁**：
# StoreLimits / PluginMetrics / WasmPluginState 原位从 wasm_core 搬入，宿主留转发。
wasmnest-host-kit = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1" }
# 插件机制整核（wasm-core-whole-crate，.scratch/2026-10-06）：wasm_core 整目录 +
# 引擎面（db/pty/enums/system 部分）+ 宿主胶水迁入本 crate；lib.rs 经 `pub use
# wasmnest_wasm_core as wasm_core` 垫片保持既有 `crate::wasm_core::*` 路径零改动。
# 2026-10-08 迁根：整核本体与能力域同落能力仓（发布形态经 git tag 消费）。
wasmnest-wasm-core = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1" }
# PTY 能力域（wasm-core 纯净性收口票 02/06 → pty-capability-domain 票 D1/D3）：
# 引擎面 + host-pty WIT 接线整面迁入能力 crate（ADR 0039）。票 02 批次 02 起宿主
# **直接消费**：端口 adapter + 强制引用行 + 白名单条目同落 `src/plugin/pty.rs`
# （wasm-core 已不再依赖本 crate，也不再出现它的任何路径）。
# lib 声明同时满足 crate_boundary_lock 断言③「宿主清单声明全部拆分产物」
# （pty-engine 已登记 SPLIT_CRATES）。
wasmnest-pty-engine = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1", features = ["common-host"] }
# 组播发现能力域（mDNS，wasm-core-lib-split 票 03）：引擎 + 宿主绑定层 + 自动
# 注册。票 02 批次 03 起宿主**直接消费**：端口 adapter 在 `src/plugin/mdns.rs`
# （wasm-core 已不再依赖本 crate，`host_context_registry` 随其退役）。
wasmnest-discovery-engine = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1", features = ["common-host"] }
wasmnest-crypto-engine = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1" }
# server-lib-split 票 03：传输无关内核（supervisor/filter/link_crypto/metrics + TransportFace 组合）
wasmnest-server-core = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1" }
# server-lib-split 票 04：HTTP 传输面（registry/gateway/controllers/middleware/dtos + HttpTransportFace）
wasmnest-server-http = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1", features = ["common-host"] }
# server-lib-split 票 05：WebSocket 传输面（conn/channel/registry/endpoint/routes/manager）
wasmnest-server-websocket = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1", features = ["common-host"] }
# server-lib-split 票 06：对等网络引擎域（节点身份/节点与发现守护生命周期/host-peer 引擎转发）
wasmnest-server-peer-net = { version = "0.0.1", git = "https://github.com/7ZAI/wasmnest-lib", tag = "lib-v0.0.1", features = ["common-host"] }
inventory = "0.3"

# Power management (prevent system sleep)
nosleep = "0.2"

# Async trait for dyn compatibility
async-trait = "0.1"

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"
dirs = "6.0.0"

# Actix Web (HTTP + WS server)
actix-web = "4"
actix = "0.13"


# Windows：WM_SETTINGCHANGE 广播（CLI PATH 注册后通知新终端/agent 进程生效）
# + 文件定位 COM API（SHOpenFolderAndSelectItems / ShellExecuteExW，见 commands/opener.rs）
# + 电源唤醒监听（GetModuleHandleW，见 system/power_wake.rs）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Registry", "Win32_System_LibraryLoader"] }

# Linux：systemd-logind 休眠抑制（org.freedesktop.login1.Inhibit）
# 与 nosleep 引入的 dbus crate 同版本（不新增依赖树）；
# 相比 nosleep 只支持 GNOME SessionManager，logind 与桌面环境无关（见 system/power.rs）
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
# 正式版禁用右键原生菜单（WebKitGTK context-menu 信号）所需；版本与 wry 锁定
# 的 =2.0.2 一致（tauri-runtime-wry → wry 传递依赖，声明为直接依赖不改变解析）
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
# 伪随机（测试 nonce/密钥生成；运行依赖的随机在 wasm-core/crypto-engine）
rand = "0.8"
tempfile = "3"
# 集成测试 HTTP 配对（POST /api/auth/* 换取 JWT）：已为运行依赖，dev 复用同版本
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
# 集成测试直连插件私有库（认证记录下沉后 pairing/历史真源在私有库，白盒断言用）
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
# unwind：panic 可被 catch_unwind（错误边界/插件宿主）捕获，插件业务 panic
# 不再拖垮整个应用（abort 会让一切 panic 处理机制失效，任何 panic 直接闪退）
panic = "unwind"
# fat LTO + 单 codegen unit 会在最终链接阶段合并全部 bitcode，峰值内存 8GB+（含 wasmtime/cranelift 时更甚），
# 在 16GB 内存机器上触发 OOM；改用 thin LTO + 并行 codegen，性能损失 ~2-5%，峰值内存大幅下降
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

# ==================== 开发模式优化 ====================
[profile.dev]
# debug = 1 全量调试信息使 rustc 编译巨型 crate（含 wasmtime）时内存峰值过高，
# 在 collect_and_partition_mono_items 阶段 OOM（0xc0000409，页面文件被禁用的机器上必现）。
# line-tables-only 保留行号回溯（debugger 变量查看不可用），编译内存与 target 体积大幅下降
debug = "line-tables-only"
incremental = true
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2

[profile.test.package.wasmtime]
debug-assertions = false

# ==================== [patch] 已迁往平台仓根 `.cargo/config.toml` ====================
# L2 起本 crate 的依赖图必须是**可发布形态**（SDK 走 crates.io、能力仓走 git tag），
# 而 `cargo package` 会拒绝带 `[patch]` 的 manifest（发布包不得内嵌本地路径重定向）。
# 同场本地开发的 patch 统一放平台仓根 `.cargo/config.toml`：
#   - `[patch."https://github.com/7ZAI/wasmnest-lib"]` → `../wasmnest-lib/<crate>`
#   - `[patch.crates-io]` → `wasmnest-desktop/packages/plugin-sdk-desktop/rust{,-macros}`
# cargo config 不进发布包，`cargo package --list` / 外部工程消费仍按 registry / git tag 解析。
